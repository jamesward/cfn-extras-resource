# CloudFormation Git sync stack deployment file.
#
# No parameters: the stack resolves its own Git-sync CodeConnections ARN via the
# connection_lookup custom resource (see infra.pkl), so nothing account-specific
# is committed. Stack name, repo, branch, region and the deployment IAM role are
# configured in the console at setup time.
template-file-path: infra/infra.yaml
tags:
  project: cfn-extras-resource
